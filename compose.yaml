name: three-memories

# Everything the demo needs, on your machine, with no API keys:
#   - Neo4j   -> the graph store used by AgentMemory for .NET
#   - Ollama  -> a local chat model and a local embedding model
#
#   docker compose up -d        # first run downloads the images and the models
#   docker compose logs models  # watch the model download
#
# Ollama is published on host port 11435 so it does not collide with an Ollama
# you may already have installed (which uses 11434).

services:
  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474" # Neo4j Browser -> http://localhost:7474
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30

  # One-shot job: pulls the two models into the ollama volume, then exits.
  models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull ${OLLAMA_EMBEDDING_MODEL:-bge-m3} && ollama pull ${OLLAMA_MODEL:-gemma3:12b}"
    restart: "no"

volumes:
  neo4j-data:
  ollama-models:
